<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="64" viewBox="0 0 1000 64" role="img" aria-label="Featured Projects" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
<linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4FD1B0"/><stop offset="1" stop-color="#7C9CFF"/></linearGradient>
<linearGradient id="s" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4FD1B0" stop-opacity="0"/><stop offset=".5" stop-color="#4FD1B0"/><stop offset="1" stop-color="#7C9CFF" stop-opacity="0"/></linearGradient>
<clipPath id="r"><rect width="1000" height="64" rx="16"/></clipPath>
</defs>
<style>
.t{font:700 26px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#f2f6fc;animation:in .8s ease-out both}
.g{font:400 15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#7f90aa}
.bar{transform-box:fill-box;transform-origin:center;animation:pulse 3s ease-in-out infinite}
@keyframes in{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:translateX(0)}}
@keyframes pulse{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.6)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="1000" height="64" rx="16" fill="#0f1626"/>
<g clip-path="url(#r)"><rect y="60" width="260" height="4" fill="url(#s)"><animate attributeName="x" values="-260;1000" dur="4.5s" repeatCount="indefinite"/></rect></g>
<rect class="bar" x="24" y="18" width="6" height="28" rx="3" fill="url(#a)"/>
<text class="t" x="46" y="42">Featured Projects</text>
<text class="g" x="976" y="39" text-anchor="end">things I've built</text>
<rect x=".5" y=".5" width="999" height="63" rx="16" fill="none" stroke="#243049"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>